networks:
  refarch:
    driver: bridge

volumes:
  postgres-data:

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: refarch-postgres
    environment:
      POSTGRES_USER: refarch
      POSTGRES_PASSWORD: refarch
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      # Healthy only after init-databases.sh finishes (inventory_db is created last),
      # so services gated on service_healthy never start against a half-initialised DB.
      test: [ "CMD-SHELL", "pg_isready -U refarch -d postgres && psql -U refarch -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='inventory_db'\" | grep -q 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ refarch ]

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: refarch-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [ refarch ]

  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: refarch-zipkin
    ports:
      - "9411:9411"
    networks: [ refarch ]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: refarch-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [ refarch ]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: refarch-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [ refarch ]

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  flaky-external-service:
    build:
      context: .
      dockerfile: flaky-external-service/Dockerfile
    container_name: refarch-flaky-external-service
    environment:
      SERVER_PORT: 8090
      FLAKY_FAILURE_RATE: "40"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8090:8090"
    networks: [ refarch ]

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: refarch-order-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: refarch
      SPRING_DATASOURCE_PASSWORD: refarch
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ refarch ]

  saga-orchestrator:
    build:
      context: .
      dockerfile: saga-orchestrator/Dockerfile
    container_name: refarch-saga-orchestrator
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saga_db
      SPRING_DATASOURCE_USERNAME: refarch
      SPRING_DATASOURCE_PASSWORD: refarch
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ refarch ]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: refarch-payment-service
    environment:
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLAKY_SERVICE_URL: http://flaky-external-service:8090
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      flaky-external-service:
        condition: service_started
    networks: [ refarch ]

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: refarch-inventory-service
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: refarch
      SPRING_DATASOURCE_PASSWORD: refarch
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ refarch ]
