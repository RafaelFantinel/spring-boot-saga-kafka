apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: zipkin }
  template:
    metadata:
      labels: { app: zipkin }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:2.24
          ports:
            - containerPort: 9411
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: refarch
spec:
  type: NodePort
  selector: { app: zipkin }
  ports:
    - port: 9411
      targetPort: 9411
      nodePort: 30411
