apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: [ "sh", "-c", "until nc -z kafka 9092; do echo waiting-kafka; sleep 2; done" ]
      containers:
        - name: payment-service
          image: refarch/payment-service:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT,                         value: "8083" }
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS,      value: "kafka:9092" }
            - { name: FLAKY_SERVICE_URL,                   value: "http://flaky-external-service:8090" }
            - { name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT,  value: "http://zipkin:9411/api/v2/spans" }
            - { name: JAVA_TOOL_OPTIONS,                   value: "-XX:MaxRAMPercentage=70" }
          ports:
            - containerPort: 8083
          startupProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8083 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { memory: "320Mi", cpu: "150m" }
            limits:   { memory: "420Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: refarch
spec:
  selector: { app: payment-service }
  ports:
    - port: 8083
      targetPort: 8083
