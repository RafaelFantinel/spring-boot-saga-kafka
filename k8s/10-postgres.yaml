apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: refarch
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER,     value: refarch }
            - { name: POSTGRES_PASSWORD, value: refarch }
            - { name: POSTGRES_DB,       value: postgres }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U refarch -d postgres && psql -U refarch -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='inventory_db'" | grep -q 1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "256Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: refarch
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
