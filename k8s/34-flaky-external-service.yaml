apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-external-service
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: flaky-external-service }
  template:
    metadata:
      labels: { app: flaky-external-service }
    spec:
      containers:
        - name: flaky-external-service
          image: refarch/flaky-external-service:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT,                         value: "8090" }
            - { name: FLAKY_FAILURE_RATE,                  value: "40" }
            - { name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT,  value: "http://zipkin:9411/api/v2/spans" }
            - { name: JAVA_TOOL_OPTIONS,                   value: "-XX:MaxRAMPercentage=70" }
          ports:
            - containerPort: 8090
          startupProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8090 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "360Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: flaky-external-service
  namespace: refarch
spec:
  selector: { app: flaky-external-service }
  ports:
    - port: 8090
      targetPort: 8090
