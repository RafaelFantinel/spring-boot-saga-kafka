apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: refarch
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'order-service'
        metrics_path: '/actuator/prometheus'
        static_configs: [ { targets: [ 'order-service:8081' ] } ]
      - job_name: 'saga-orchestrator'
        metrics_path: '/actuator/prometheus'
        static_configs: [ { targets: [ 'saga-orchestrator:8082' ] } ]
      - job_name: 'payment-service'
        metrics_path: '/actuator/prometheus'
        static_configs: [ { targets: [ 'payment-service:8083' ] } ]
      - job_name: 'inventory-service'
        metrics_path: '/actuator/prometheus'
        static_configs: [ { targets: [ 'inventory-service:8084' ] } ]
      - job_name: 'flaky-external-service'
        metrics_path: '/actuator/prometheus'
        static_configs: [ { targets: [ 'flaky-external-service:8090' ] } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: refarch
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
