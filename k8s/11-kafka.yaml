apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.7
          env:
            - { name: KAFKA_CFG_NODE_ID,                          value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES,                    value: "controller,broker" }
            - { name: KAFKA_CFG_LISTENERS,                        value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS,             value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP,   value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES,        value: "CONTROLLER" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS,         value: "0@localhost:9093" }
            - { name: KAFKA_KRAFT_CLUSTER_ID,                     value: "MkU3OEVBNTcwNTJENDM2Qk" }
            - { name: ALLOW_PLAINTEXT_LISTENER,                   value: "yes" }
            - { name: KAFKA_HEAP_OPTS,                            value: "-Xmx640m -Xms256m" }
          ports:
            - containerPort: 9092
            - containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests: { memory: "768Mi", cpu: "250m" }
            limits:   { memory: "1200Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: refarch
spec:
  selector: { app: kafka }
  ports:
    - { name: broker,     port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
