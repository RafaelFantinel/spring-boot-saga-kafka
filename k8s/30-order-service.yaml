apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: refarch
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: [ "sh", "-c", "until nc -z postgres 5432; do echo waiting-postgres; sleep 2; done" ]
        - name: wait-kafka
          image: busybox:1.36
          command: [ "sh", "-c", "until nc -z kafka 9092; do echo waiting-kafka; sleep 2; done" ]
      containers:
        - name: order-service
          image: refarch/order-service:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT,                         value: "8081" }
            - { name: SPRING_DATASOURCE_URL,               value: "jdbc:postgresql://postgres:5432/orders_db" }
            - { name: SPRING_DATASOURCE_USERNAME,          value: "refarch" }
            - { name: SPRING_DATASOURCE_PASSWORD,          value: "refarch" }
            - { name: SPRING_KAFKA_BOOTSTRAP_SERVERS,      value: "kafka:9092" }
            - { name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT,  value: "http://zipkin:9411/api/v2/spans" }
            - { name: JAVA_TOOL_OPTIONS,                   value: "-XX:MaxRAMPercentage=70" }
          ports:
            - containerPort: 8081
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { memory: "320Mi", cpu: "150m" }
            limits:   { memory: "420Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: refarch
spec:
  type: NodePort
  selector: { app: order-service }
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
